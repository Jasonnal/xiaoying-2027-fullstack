name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and build
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend · lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8080

  mysql-smoke:
    name: Backend · real MySQL smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: material_studio
          MYSQL_USER: studio
          MYSQL_PASSWORD: studio123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Boot against MySQL 8 and hit the API
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/material_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          DB_USER: studio
          DB_PASSWORD: studio123
          SIM_STAGE_DELAY_MS: "0"
        run: |
          java -jar target/material-studio-1.0.0.jar > app.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then break; fi
            sleep 2
          done
          echo "--- health ---"
          curl -fsS http://127.0.0.1:8080/api/health
          echo
          echo "--- templates (count) ---"
          curl -fsS http://127.0.0.1:8080/api/templates | head -c 400
          echo
          tail -30 app.log

  compose:
    name: Docker · compose up & end-to-end smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Bring the stack up
        run: docker compose up -d
      - name: Wait for backend and frontend
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/api/health
          echo
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q "MOTION STUDIO"
          curl -fsS -o /dev/null -w "frontend=%{http_code}\n" http://127.0.0.1:3000/

      - name: End-to-end smoke through the running stack
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8080
          JAR=/tmp/cookies.txt

          echo "--- 1) 登录（账号+密码） ---"
          curl -fsS -c "$JAR" -H 'Content-Type: application/json' \
            -d '{"handle":"demo","password":"demo1234"}' "$BASE/api/auth/session"
          echo

          echo "--- 2) 模板与分类由 Java 提供 ---"
          curl -fsS "$BASE/api/templates" | jq -r '"categories=\(.categories|length) templates=\(.templates|length)"'

          echo "--- 3) 上传素材 ---"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' | base64 -d > /tmp/seed.png
          ASSET=$(curl -fsS -b "$JAR" -F "file=@/tmp/seed.png;type=image/png" "$BASE/api/assets" | jq -r .id)
          echo "asset=$ASSET"

          echo "--- 4) 受理任务（立即返回） ---"
          JOB=$(curl -fsS -b "$JAR" -H 'Content-Type: application/json' \
            -d "{\"templateId\":\"retro-film\",\"assetIds\":[\"$ASSET\"]}" "$BASE/api/jobs" | jq -r .id)
          echo "job=$JOB"

          echo "--- 5) 轮询到终态 ---"
          STATUS=""
          for i in $(seq 1 60); do
            BODY=$(curl -fsS -b "$JAR" "$BASE/api/jobs/$JOB")
            STATUS=$(echo "$BODY" | jq -r .status)
            echo "  $STATUS / $(echo "$BODY" | jq -r .stage)"
            if [ "$STATUS" = "SUCCEEDED" ] || [ "$STATUS" = "FAILED" ]; then break; fi
            sleep 2
          done
          [ "$STATUS" = "SUCCEEDED" ]
          RESULT=$(echo "$BODY" | jq -r .resultUrl)
          echo "resultUrl=$RESULT"

          echo "--- 6) 结果图可访问 ---"
          curl -fsS -o /tmp/result.jpg -w "result=%{http_code} type=%{content_type} bytes=%{size_download}\n" "$BASE$RESULT"

          echo "--- 7) 指定阶段失败可复现，且失败即中断 ---"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"failStage":"GENERATE","failCount":1}' "$BASE/api/dev/simulation"
          echo
          JOB2=$(curl -fsS -b "$JAR" -H 'Content-Type: application/json' \
            -d "{\"templateId\":\"retro-film\",\"assetIds\":[\"$ASSET\"]}" "$BASE/api/jobs" | jq -r .id)
          STATUS2=""
          for i in $(seq 1 60); do
            BODY2=$(curl -fsS -b "$JAR" "$BASE/api/jobs/$JOB2")
            STATUS2=$(echo "$BODY2" | jq -r .status)
            if [ "$STATUS2" = "FAILED" ] || [ "$STATUS2" = "SUCCEEDED" ]; then break; fi
            sleep 2
          done
          echo "$BODY2" | jq -c '{status,stage,errorStage,errorMessage,resultUrl}'
          [ "$STATUS2" = "FAILED" ]
          [ "$(echo "$BODY2" | jq -r .errorStage)" = "GENERATE" ]
          [ "$(echo "$BODY2" | jq -r .resultUrl)" = "null" ]

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=120

      - name: Tear down
        if: always()
        run: docker compose down -v
